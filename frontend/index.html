<!-- ============================================================
  index.html — Ponto de entrada do Frontend
  ============================================================
  Este é o ficheiro HTML principal. Quando o Vite faz o build,
  ele injeta automaticamente os ficheiros JavaScript e CSS aqui.
  
  Nota: O Vite trata este ficheiro como "ponto de entrada".
  Não precisas de adicionar <script> ou <link> manualmente —
  o Vite faz isso por ti no build.
  ============================================================ -->
<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <!--
      meta charset: Define a codificação de caracteres como UTF-8.
      Isto permite usar acentos, cedilhas, emojis, etc.
    -->
    <meta charset="UTF-8" />

    <!--
      viewport: Configura como a página se comporta em dispositivos móveis.
      width=device-width → usa a largura real do ecrã
      initial-scale=1.0 → não faz zoom no carregamento
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      title: O texto que aparece na aba do navegador
    -->
    <title>Gestão de Tarefas</title>
  </head>
  <body>
    <!--
      div#root: O React vai "montar" a aplicação aqui dentro.
      Tudo o que o React renderizar aparece dentro desta div.
      
      No main.jsx, fazemos:
        ReactDOM.createRoot(document.getElementById("root"))
          .render(<App />)
    -->
    <div id="root"></div>

    <!--
      script type="module" src="/src/main.jsx":
      Diz ao Vite para carregar o main.jsx como módulo ES.
      O Vite processa este ficheiro e trata dos imports,
      do React, do JSX, etc.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
